<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PetHaven | Product Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="product" class="bg-slate-50">
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-emerald-600">🐾 PetHaven</a>
            <button id="cart-open-button">🛒 <span id="cart-count">0</span></button>
        </div>
    </header>
    <main id="main-content" class="mx-auto max-w-7xl px-4 py-12">
        <!-- This section will be populated by app.js using the Product Detail Logic -->
        <div id="product-detail" class="grid lg:grid-cols-2 gap-12">
            <div class="animate-pulse bg-slate-200 h-96 rounded-3xl"></div>
            <div class="space-y-4">
                <div class="h-8 bg-slate-200 w-1/2 rounded"></div>
                <div class="h-4 bg-slate-200 w-full rounded"></div>
                <div class="h-12 bg-slate-200 w-32 rounded"></div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
