<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyPetshoppy | Reset password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="reset-password" class="bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-2xl font-extrabold tracking-tight"><span class="text-rose-500">My</span><span class="text-emerald-600">Petshoppy</span></a>
    </div>
  </header>

  <main class="mx-auto max-w-md px-4 py-16 sm:px-6 lg:px-8">
    <section class="rounded-3xl bg-white p-8 shadow-sm border border-slate-200">
      <h1 class="text-2xl font-bold text-slate-900">Set a new password</h1>
      <p class="mt-2 text-sm text-slate-500">Choose a new password for your account.</p>

      <form id="reset-password-form" class="mt-6 space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-700">New password</label>
          <input name="password" type="password" required minlength="6" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" />
        </div>
        <div>
          <label class="text-sm font-medium text-slate-700">Confirm new password</label>
          <input name="confirmPassword" type="password" required minlength="6" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" />
        </div>
        <button type="submit" class="w-full rounded-full bg-emerald-600 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-700">Update password</button>
        <p id="reset-password-status" class="text-sm text-center"></p>
      </form>

      <p id="no-token-message" class="hidden text-sm text-red-600">This link is missing its reset token. Please request a new password reset from the <a href="account.html" class="underline">account page</a>.</p>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const form = document.getElementById('reset-password-form');
      const status = document.getElementById('reset-password-status');

      if (!token) {
        form.classList.add('hidden');
        document.getElementById('no-token-message').classList.remove('hidden');
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = form.querySelector('input[name="password"]').value;
        const confirmPassword = form.querySelector('input[name="confirmPassword"]').value;
        const submitBtn = form.querySelector('button[type="submit"]');

        if (password !== confirmPassword) {
          status.textContent = 'Passwords do not match.';
          status.className = 'text-sm text-center text-red-600';
          return;
        }

        submitBtn.disabled = true;
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Something went wrong.');

          status.textContent = 'Password updated! Redirecting to sign in...';
          status.className = 'text-sm text-center text-green-600';
          setTimeout(() => { window.location.href = 'account.html'; }, 1800);
        } catch (err) {
          status.textContent = err.message || 'Something went wrong. Please request a new link.';
          status.className = 'text-sm text-center text-red-600';
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>

</html>
