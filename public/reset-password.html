<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identity Recovery | PetHaven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body data-page="reset-password" class="bg-slate-50 font-sans text-slate-900">
    <header class="bg-white border-b h-20 flex items-center sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex items-center gap-3">
            <span class="text-3xl">🐾</span>
            <a href="index.html" class="text-2xl font-black text-emerald-600 tracking-tighter">PetHaven</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-24">
        <section class="bg-white rounded-[3rem] p-12 shadow-2xl border border-gray-100 overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-2 bg-emerald-600"></div>
            <div class="relative z-10">
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter mb-4">Set New Password</h1>
                <p class="text-slate-400 font-medium mb-10 leading-relaxed">Choose a secure, complex password to protect
                    your pet parent profile and transaction history.</p>

                <form id="reset-password-form" class="space-y-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">New Secure
                            Key</label>
                        <input name="password" type="password" required minlength="8"
                            class="w-full p-5 bg-slate-50 border-none rounded-2xl text-lg font-bold outline-none focus:ring-4 focus:ring-emerald-500/10">
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Confirm
                            Secure Key</label>
                        <input name="confirmPassword" type="password" required minlength="8"
                            class="w-full p-5 bg-slate-50 border-none rounded-2xl text-lg font-bold outline-none focus:ring-4 focus:ring-emerald-500/10">
                    </div>
                    <button type="submit"
                        class="w-full bg-emerald-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-xl shadow-emerald-200 hover:scale-[1.02] active:scale-95 transition-all">
                        Update Credentials
                    </button>
                    <p id="reset-password-status" class="text-center font-black uppercase text-[10px] tracking-[0.2em]">
                    </p>
                </form>

                <div id="no-token-message" class="hidden text-center py-10">
                    <span class="text-5xl block mb-6">⚠️</span>
                    <p class="text-rose-500 font-black text-lg tracking-tighter mb-4">Invalid Recovery Token</p>
                    <p class="text-slate-400 font-medium text-sm mb-8">This recovery node has expired or is invalid.
                        Please request a new link via your account dashboard.</p>
                    <a href="account.html"
                        class="inline-block px-10 py-4 bg-slate-900 text-white rounded-full font-bold text-sm uppercase tracking-widest">Return
                        to Account</a>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        (function () {
            const token = new URLSearchParams(window.location.search).get('token');
            const form = document.getElementById('reset-password-form');
            const status = document.getElementById('reset-password-status');
            if (!token) {
                form.classList.add('hidden');
                document.getElementById('no-token-message').classList.remove('hidden');
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const p1 = form.querySelector('[name="password"]').value;
                const p2 = form.querySelector('[name="confirmPassword"]').value;
                if (p1 !== p2) return alert("Passwords do not match.");

                status.textContent = "Propagating Identity Update...";
                status.className = "text-center font-black text-amber-500 text-[10px]";

                try {
                    await performPetHavenRequest('/api/auth/reset-password', {
                        method: 'POST',
                        body: JSON.stringify({ token, newPassword: p1 })
                    });
                    status.textContent = "Identity Synchronized. Redirecting...";
                    status.className = "text-center font-black text-emerald-500 text-[10px]";
                    setTimeout(() => window.location.href = 'account.html', 2000);
                } catch (err) {
                    status.textContent = "Identity Fault: " + err.message;
                    status.className = "text-center font-black text-rose-500 text-[10px]";
                }
            });
        })();
    </script>
</body>

</html>
