<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PetHaven | My Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="account" class="bg-slate-50">
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-emerald-600">🐾 PetHaven</a>
            <a href="index.html" class="text-sm font-medium">Back to Shop</a>
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-4 py-10">
        <section class="mb-10 rounded-3xl bg-gradient-to-r from-emerald-50 to-teal-50 p-8 border border-emerald-100">
            <h1 class="text-3xl font-bold text-slate-900">Welcome to the Pack</h1>
            <p class="mt-2 text-slate-500">Manage your pet orders and profile.</p>
        </section>
        <div class="grid gap-10 lg:grid-cols-2">
            <div id="auth-area" class="bg-white p-8 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-bold mb-6">Sign In</h2>
                <form id="login-form" class="space-y-4">
                    <input name="email" type="email" placeholder="Email"
                        class="w-full rounded-2xl border p-4 outline-none focus:ring-2 focus:ring-emerald-100" />
                    <input name="password" type="password" placeholder="Password"
                        class="w-full rounded-2xl border p-4 outline-none focus:ring-2 focus:ring-emerald-100" />
                    <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-full font-bold">Access My
                        Account</button>
                </form>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-sm border">
                <h2 class="text-xl font-bold mb-6">Order History</h2>
                <div id="order-history" class="text-slate-400 text-sm">No pet supplies ordered yet.</div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
